name: M_C Gate 4 official-data cold start

on:
  push:
    branches:
      - gate4-mc-coldstart-20260927
    paths:
      - "tools/mc_gate4/**"
      - ".github/workflows/mc_gate4_coldstart.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mc-gate4-coldstart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out gate branch
        uses: actions/checkout@v4
        with:
          ref: gate4-mc-coldstart-20260927
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scipy>=1.11,<2" "requests>=2.31,<3"

      - name: Acquire official data and run shadow cold start
        env:
          PYTHONHASHSEED: "0"
          TZ: UTC
        run: |
          rm -rf gate4_mc_output
          python tools/mc_gate4/run_gate4_v3.py --output gate4_mc_output

      - name: Verify direct M_C identification veto
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("gate4_mc_output/artifacts/run_summary.json").read_text())
          assert summary["direct_mc_estimable_cells"] == 0
          assert summary["verdict"] == "PASS_WITH_DIRECT_MC_IDENTIFICATION_VETO"
          assert "wage_index" in summary["panel_columns"]
          assert "registered_employment_quarterly" in summary["panel_columns"]
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Upload complete reproducibility bundle
        uses: actions/upload-artifact@v4
        with:
          name: bayme-mc-gate4-official-data
          path: gate4_mc_output
          if-no-files-found: error
          retention-days: 30

      - name: Commit compact official-data outputs to the gate branch
        run: |
          git config user.name "bayme-mc-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A gate4_mc_output
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Add M_C Gate 4 official-data cold start"
            git push origin HEAD:gate4-mc-coldstart-20260927
          fi
